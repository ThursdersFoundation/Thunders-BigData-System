<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Dashboard pattern">
  <defs>
    <pattern id="dp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#f59e0b" opacity="0.10"/>
    </pattern>
    <pattern id="dp-lines" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 90 Q30 60 60 90 T120 90" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.07"/>
      <path d="M0 60 Q30 30 60 60 T120 60" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#dp-grid)"/>
  <rect width="120" height="120" fill="url(#dp-lines)"/>
</svg>
